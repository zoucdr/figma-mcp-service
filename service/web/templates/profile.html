{{ define "content" }}
<div class="app-container">
    <!-- 顶部导航栏 -->
    <el-header class="app-header">
        <div class="logo">Figma Bridge</div>
        <div class="user-info">
            <el-dropdown trigger="click" @command="handleCommand">
                <span class="el-dropdown-link">
                    {{ .username }} <i class="el-icon-arrow-down el-icon--right"></i>
                </span>
                <el-dropdown-menu slot="dropdown">
                    <el-dropdown-item command="dashboard">返回仪表盘</el-dropdown-item>
                    <el-dropdown-item command="logout">退出登录</el-dropdown-item>
                </el-dropdown-menu>
            </el-dropdown>
        </div>
    </el-header>
    
    <!-- 主内容区 -->
    <el-main class="app-main">
        <el-card class="profile-card">
            <div slot="header">
                <span>个人资料</span>
            </div>
            
            <el-form :model="profileForm" :rules="profileRules" ref="profileForm" label-width="120px">
                <el-form-item label="用户名" prop="username">
                    <el-input v-model="profileForm.username" placeholder="请输入用户名"></el-input>
                </el-form-item>
                <el-form-item label="Figma Token" prop="figmaToken">
                    <el-input v-model="profileForm.figmaToken" placeholder="输入Figma Private Token"></el-input>
                    <div class="form-tip">
                        <i class="el-icon-info"></i>
                        <span>您可以在Figma账户设置中生成个人访问令牌</span>
                    </div>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" @click="updateProfile" :loading="loading">保存设置</el-button>
                </el-form-item>
            </el-form>
        </el-card>
    </el-main>
</div>
{{ end }}

{{ define "scripts" }}
<script>
new Vue({
    el: '#app',
    data() {
        return {
            loading: false,
            profileForm: {
                username: '{{ .username }}',
                figmaToken: '{{ .figmaToken }}'
            },
            profileRules: {
                username: [
                    // 用户名可以为空
                ],
                figmaToken: [
                    { required: true, message: '请输入Figma Private Token', trigger: 'blur' }
                ]
            }
        };
    },
    methods: {
        handleCommand(command) {
            if (command === 'dashboard') {
                window.location.href = '/dashboard';
            } else if (command === 'logout') {
                window.location.href = '/logout';
            }
        },
        updateProfile() {
            this.$refs.profileForm.validate(valid => {
                if (valid) {
                    this.loading = true;
                    const formData = new FormData();
                    formData.append('username', this.profileForm.username);
                    formData.append('figma_token', this.profileForm.figmaToken);
                    // 添加CSRF令牌
                    formData.append('_csrf', '{{ .csrf_token }}');
                    
                    axios.post('/profile/update', formData)
                        .then(response => {
                            this.$message.success('个人资料更新成功');
                        })
                        .catch(error => {
                            this.$message.error(error.response?.data?.error || '更新失败');
                        })
                        .finally(() => {
                            this.loading = false;
                        });
                }
            });
        }
    }
});
</script>
<style>
.app-container {
    height: 100vh;
    display: flex;
    flex-direction: column;
}
.app-header {
    background-color: #409EFF;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}
.logo {
    font-size: 20px;
    font-weight: bold;
}
.user-info {
    cursor: pointer;
}
.el-dropdown-link {
    color: #fff;
}
.app-main {
    flex: 1;
    background-color: #f5f7fa;
    padding: 20px;
}
.profile-card {
    max-width: 600px;
    margin: 0 auto;
}
.form-tip {
    font-size: 12px;
    color: #909399;
    margin-top: 5px;
}
</style>
{{ end }}
