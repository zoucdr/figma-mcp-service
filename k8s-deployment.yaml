# Figma Deliver Kubernetes 部署配置
# 包含 Deployment, Service, ConfigMap, Secret 等资源

---
# ConfigMap - 应用配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: figma-deliver-config
  namespace: default
data:
  PORT: "8080"
  GIN_MODE: "release"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "figma_deliver"
  EXPORT_DIR: "/app/exports"
  TEMP_DIR: "/app/temp"

---
# Secret - 敏感信息
apiVersion: v1
kind: Secret
metadata:
  name: figma-deliver-secret
  namespace: default
type: Opaque
data:
  # 注意：以下值需要 base64 编码
  # echo -n "your-secret" | base64
  SESSION_SECRET: ZmlnbWEtYnJpZGdlLXNlY3JldC1rZXktY2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbg==
  DB_USER: ZmlnbWFfdXNlcg==
  DB_PASS: ZmlnbWFfcGFzc3dvcmQ=
  MYSQL_ROOT_PASSWORD: cm9vdF9wYXNzd29yZA==

---
# PersistentVolumeClaim - 持久化存储
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: figma-deliver-exports-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: figma-deliver-temp-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard

---
# MySQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: default
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: figma-deliver-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: figma-deliver-config
              key: DB_NAME
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: figma-deliver-secret
              key: DB_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: figma-deliver-secret
              key: DB_PASS
        - name: MYSQL_CHARACTER_SET_SERVER
          value: "utf8mb4"
        - name: MYSQL_COLLATION_SERVER
          value: "utf8mb4_unicode_ci"
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-init
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -u
            - root
            - -proot_password
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -u
            - root
            - -proot_password
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-data-pvc
      - name: mysql-init
        configMap:
          name: mysql-init-config

---
# MySQL Service
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: default
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
  type: ClusterIP

---
# MySQL 初始化脚本 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-config
  namespace: default
data:
  init.sql: |
    -- Figma Deliver 数据库初始化脚本
    SET NAMES utf8mb4;
    SET FOREIGN_KEY_CHECKS = 0;
    
    CREATE DATABASE IF NOT EXISTS `figma_deliver` 
    DEFAULT CHARACTER SET utf8mb4 
    COLLATE utf8mb4_unicode_ci;
    
    USE `figma_deliver`;
    
    -- 用户表
    CREATE TABLE IF NOT EXISTS `users` (
      `id` bigint(20) unsigned NOT NULL AUTO_INCREMENT,
      `created_at` datetime(3) DEFAULT NULL,
      `updated_at` datetime(3) DEFAULT NULL,
      `deleted_at` datetime(3) DEFAULT NULL,
      `username` varchar(191) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
      `email` varchar(191) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
      `password_hash` varchar(191) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
      `figma_token` varchar(191) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
      `mcp_token` varchar(191) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
      `mcp_token_created_at` datetime(3) DEFAULT NULL,
      PRIMARY KEY (`id`),
      UNIQUE KEY `idx_users_username` (`username`),
      UNIQUE KEY `idx_users_email` (`email`),
      UNIQUE KEY `idx_users_mcp_token` (`mcp_token`),
      KEY `idx_users_deleted_at` (`deleted_at`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
    
    -- 创建默认管理员用户（密码：admin123）
    INSERT IGNORE INTO `users` (`username`, `email`, `password_hash`, `created_at`, `updated_at`) 
    VALUES ('admin', 'admin@figma-deliver.local', '$2a$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi', NOW(), NOW());
    
    SET FOREIGN_KEY_CHECKS = 1;

---
# Figma Deliver Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: figma-deliver
  namespace: default
  labels:
    app: figma-deliver
    version: v1.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: figma-deliver
  template:
    metadata:
      labels:
        app: figma-deliver
        version: v1.0
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: figma-deliver
        image: figma-deliver:latest  # 替换为你的镜像地址
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: figma-deliver-config
              key: PORT
        - name: GIN_MODE
          valueFrom:
            configMapKeyRef:
              name: figma-deliver-config
              key: GIN_MODE
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: figma-deliver-secret
              key: SESSION_SECRET
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: figma-deliver-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: figma-deliver-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: figma-deliver-secret
              key: DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: figma-deliver-secret
              key: DB_PASS
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: figma-deliver-config
              key: DB_NAME
        - name: EXPORT_DIR
          valueFrom:
            configMapKeyRef:
              name: figma-deliver-config
              key: EXPORT_DIR
        - name: TEMP_DIR
          valueFrom:
            configMapKeyRef:
              name: figma-deliver-config
              key: TEMP_DIR
        - name: K8S_READY
          value: "true"
        volumeMounts:
        - name: exports-storage
          mountPath: /app/exports
        - name: temp-storage
          mountPath: /app/temp
        livenessProbe:
          httpGet:
            path: /about
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /about
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /about
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: exports-storage
        persistentVolumeClaim:
          claimName: figma-deliver-exports-pvc
      - name: temp-storage
        persistentVolumeClaim:
          claimName: figma-deliver-temp-pvc
      restartPolicy: Always

---
# Figma Deliver Service
apiVersion: v1
kind: Service
metadata:
  name: figma-deliver-service
  namespace: default
  labels:
    app: figma-deliver
spec:
  selector:
    app: figma-deliver
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP

---
# Ingress (可选)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: figma-deliver-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  rules:
  - host: figma-deliver.local  # 替换为你的域名
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: figma-deliver-service
            port:
              number: 80

---
# HorizontalPodAutoscaler (可选)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: figma-deliver-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: figma-deliver
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
