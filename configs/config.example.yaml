# Figma Deliver 配置文件示例
# 复制此文件为 config.yaml 并修改相应配置

app:
  port: "8080"                    # 服务端口
  gin_mode: "debug"               # Gin模式: debug, release, test
  session_secret: "figma-deliver-secret-change-me"  # 会话密钥，生产环境请修改

database:
  host: "localhost"               # 数据库主机
  port: "3306"                   # 数据库端口
  user: "figma_user"             # 数据库用户名
  password: "your_password"       # 数据库密码
  name: "figma_deliver"          # 数据库名称

storage:
  export_dir: "./exports"         # 导出文件存储目录
  temp_dir: "./temp"             # 临时文件目录

# 注意：
# 1. 环境变量会覆盖此配置文件中的设置
# 2. 支持的环境变量：
#    - PORT, GIN_MODE, SESSION_SECRET
#    - DB_HOST, DB_PORT, DB_USER, DB_PASS, DB_NAME
#    - EXPORT_DIR, TEMP_DIR
# 3. 如果没有找到 config.yaml，系统会回退到使用 .env 文件
