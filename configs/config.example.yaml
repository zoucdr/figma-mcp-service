# Figma Deliver 配置文件示例
# 复制此文件为 config.yaml 并修改配置值

app:
  # 服务端口
  port: "8080"
  
  # Gin 模式: debug, release, test
  gin_mode: "debug"
  
  # Session 密钥（生产环境请修改为随机字符串）
  session_secret: "your-secret-key-here"

database:
  # MySQL 数据库配置
  host: "127.0.0.1"
  port: "3306"
  user: "root"
  password: "your-password-here"
  name: "figma_deliver"

storage:
  # 导出文件存储目录
  export_dir: "./exports"
  
  # 临时文件存储目录
  temp_dir: "./temp"

# Figma API 配置
figma_api:
  # Images API 速率限制（秒）
  # 两次调用 api.figma.com/v1/images 之间的最小间隔
  # 
  # 说明：
  # - 此配置用于防止频繁调用 Figma API 导致触发速率限制
  # - 超过频率的请求会自动排队等待
  # - 建议值：10-15 秒
  # - 最小值：建议不小于 5 秒
  # - 默认值：10 秒（如果未配置）
  #
  # 配置调整方法：
  # 1. 直接修改此处的数值
  # 2. 使用环境变量 FIGMA_API_RATE_LIMIT 覆盖
  #
  # 注意：修改配置后需要重启服务才能生效
  images_api_rate_limit: 10
