{{ define "code-preview.html" }}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }} - Figma Deliver</title>
    <link rel="stylesheet" href="/static/lib/element-ui/index.css">
    <link rel="stylesheet" href="/static/css/code-preview.css?v={{ .timestamp }}">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>
<body>
    <div id="code-preview-app" class="code-preview-app">
        <!-- 顶部导航栏 -->
        <div class="preview-header">
            <div class="header-left">
                <div class="project-info">
                    <i class="el-icon-mobile"></i>
                    <h1>{{ .project_name }} - Swift 代码预览</h1>
                </div>
            </div>
            <div class="header-right">
                <el-button 
                    type="info" 
                    size="small"
                    @click="regenerateCode" 
                    :loading="regenerating">
                    <i class="el-icon-refresh"></i> 重新生成
                </el-button>
                <el-button 
                    type="success" 
                    @click="exportAllCode" 
                    :loading="exporting">
                    <i class="el-icon-download"></i> 导出全部代码
                </el-button>
                <el-button 
                    type="primary" 
                    @click="openSettings">
                    <i class="el-icon-setting"></i> 导出设置
                </el-button>
                <el-button 
                    size="small"
                    @click="closePreview">
                    <i class="el-icon-close"></i> 关闭
                </el-button>
            </div>
        </div>

        <!-- 主要内容区域 -->
        <div class="preview-content">
            <!-- 文件列表侧边栏 -->
            <div class="file-sidebar">
                <div class="sidebar-header">
                    <h3>文件列表</h3>
                    <span class="file-count">({{ .file_count }} 个文件)</span>
                </div>
                <div class="file-list">
                    <div 
                        v-for="(content, filename) in codeFiles" 
                        :key="filename"
                        :class="['file-item', { active: activeFile === filename }]"
                        @click="selectFile(filename)">
                        <div class="file-info">
                            <i :class="getFileIcon(filename)"></i>
                            <span class="filename" v-text="filename"></span>
                        </div>
                        <div class="file-meta">
                            <span class="file-size" v-text="getFileSize(content)"></span>
                            <el-button 
                                size="mini" 
                                type="text"
                                @click.stop="copyFile(filename, content)">
                                <i class="el-icon-document-copy"></i>
                            </el-button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 代码显示区域 -->
            <div class="code-display">
                <div v-if="activeFile" class="code-container">
                    <!-- 代码文件头部 -->
                    <div class="code-header">
                        <div class="file-title">
                            <i :class="getFileIcon(activeFile)"></i>
                            <span class="filename" v-text="activeFile"></span>
                            <span class="file-size" v-text="'(' + getFileSize(codeFiles[activeFile]) + ')'"></span>
                        </div>
                        <div class="code-actions">
                            <el-button 
                                size="mini" 
                                type="primary"
                                @click="copyFile(activeFile, codeFiles[activeFile])">
                                <i class="el-icon-document-copy"></i> 复制代码
                            </el-button>
                            <el-button 
                                size="mini" 
                                type="info"
                                @click="downloadFile(activeFile, codeFiles[activeFile])">
                                <i class="el-icon-download"></i> 下载文件
                            </el-button>
                        </div>
                    </div>

                    <!-- 代码内容 -->
                    <div class="code-content">
                        <pre class="code-block" :class="getLanguageClass(activeFile)"><code v-text="codeFiles[activeFile]"></code></pre>
                    </div>
                </div>

                <!-- 空状态 -->
                <div v-else class="empty-state">
                    <el-empty description="请选择一个文件查看代码">
                        <el-button type="primary" @click="generateCode" :loading="generating">
                            <i class="el-icon-magic-stick"></i> 生成代码
                        </el-button>
                    </el-empty>
                </div>
            </div>
        </div>

        <!-- 导出设置弹窗 -->
        <el-dialog 
            title="Swift 导出设置" 
            :visible.sync="settingsDialogVisible" 
            width="500px" 
            class="settings-dialog">
            
            <el-form label-width="120px">
                <el-form-item label="图片格式:">
                    <el-select v-model="exportConfig.imageFormat" style="width: 100%;">
                        <el-option label="PNG (推荐)" value="png"></el-option>
                        <el-option label="JPG" value="jpg"></el-option>
                        <el-option label="SVG" value="svg"></el-option>
                    </el-select>
                </el-form-item>
                
                <el-form-item label="图片缩放:">
                    <el-select v-model="exportConfig.imageScale" style="width: 100%;">
                        <el-option label="1x" :value="1.0"></el-option>
                        <el-option label="2x (推荐)" :value="2.0"></el-option>
                        <el-option label="3x" :value="3.0"></el-option>
                    </el-select>
                </el-form-item>
                
                <el-form-item label="代码风格:">
                    <el-select v-model="exportConfig.codeStyle" style="width: 100%;">
                        <el-option label="UIKit + Auto Layout" value="uikit-autolayout"></el-option>
                        <el-option label="UIKit + Frame" value="uikit-frame"></el-option>
                    </el-select>
                </el-form-item>
                
                <el-form-item label="生成选项:">
                    <el-checkbox-group v-model="exportConfig.options">
                        <el-checkbox label="generateExtensions">生成扩展文件</el-checkbox>
                        <el-checkbox label="generateResourceManager">生成资源管理器</el-checkbox>
                        <el-checkbox label="generateConstraintHelpers">生成约束辅助方法</el-checkbox>
                    </el-checkbox-group>
                </el-form-item>
            </el-form>
            
            <div slot="footer" class="dialog-footer">
                <el-button @click="settingsDialogVisible = false">取消</el-button>
                <el-button type="primary" @click="applySettings" :loading="applying">应用设置</el-button>
            </div>
        </el-dialog>
    </div>

    <!-- JavaScript -->
    <script src="/static/lib/vue/vue.min.js"></script>
    <script src="/static/lib/element-ui/index.js"></script>
    <script>
        // 初始数据
        window.codePreviewData = {
            projectId: {{ .project_id }},
            projectName: '{{ .project_name }}',
            codeFiles: {{ .code_files }},
            exportConfig: {{ .export_config }},
            csrfToken: '{{ .csrf_token }}'
        };
    </script>
    <script src="/static/js/code-preview.js?v={{ .timestamp }}"></script>
</body>
</html>
{{ end }}
